apply plugin: 'com.android.application'

//release signing comes from the CI secrets; without them, release builds stay unsigned
def signingKeystore = System.getenv("SIGNING_KEYSTORE_PATH")

android {
    namespace = "com.wesaphzt.privatelock"
    compileSdk = 37
    defaultConfig {
        applicationId = "com.wesaphzt.privatelock"
        minSdk = 23
        targetSdk = 37
        versionCode = 4
        versionName = "1.3-trustedwifi"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (signingKeystore) {
                storeFile = file(signingKeystore)
                storeType = "pkcs12"
                storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                keyPassword = System.getenv("SIGNING_STORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (signingKeystore) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.github.AppIntro:AppIntro:5.1.0'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
