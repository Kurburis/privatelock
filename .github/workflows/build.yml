name: Build APK

# Every push builds an APK. Pushing a tag such as v1.3 also publishes a GitHub release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-report
          path: app/build/reports/tests/

      # the secret itself is exposed only to the step that writes the keystore
      - name: Check for signing key
        id: key
        env:
          HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release tags need the SIGNING_KEYSTORE_BASE64 secret"
            exit 1
          fi

      - name: Write signing key
        if: steps.key.outputs.present == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        if: steps.key.outputs.present == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/privatelock-${GITHUB_REF_NAME//\//-}.apk"

      - name: Build debug APK (no signing key configured)
        if: steps.key.outputs.present != 'true'
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/privatelock-${GITHUB_REF_NAME//\//-}-debug.apk"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apk
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: apk
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.apk
          generate_release_notes: true
